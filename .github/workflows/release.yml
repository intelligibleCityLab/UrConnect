name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      repair_windows_release:
        description: 'Existing release tag to repair Windows packaging only (leave empty for a full build)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    if: ${{ !inputs.repair_windows_release }}
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            artifact: UrConnect-windows-x64
            package-suffix: windows-x64
            release-status: Windows desktop and standalone CLI
          - name: macos-arm64
            os: macos-15
            artifact: UrConnect-macos-arm64
            package-suffix: macos-arm64-experimental
            release-status: Experimental macOS build
          - name: linux-x64
            os: ubuntu-24.04
            artifact: UrConnect-linux-x64
            package-suffix: linux-x64-experimental
            release-status: Experimental Linux build

    steps:
      - uses: actions/checkout@v5

      - name: Install Windows Qt
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: win64_msvc2019_64
          cache: true

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          code_version="$(sed -nE 's/^project\(UrConnect VERSION ([0-9]+\.[0-9]+\.[0-9]+)\)$/\1/p' CMakeLists.txt)"
          if [ -z "$code_version" ] || [ "$GITHUB_REF_NAME" != "v$code_version" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match UrConnect version $code_version"
            exit 1
          fi

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install boost-msvc-14.3 -y
          $boost = Get-ChildItem C:\local -Directory -Filter "boost_*" | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $boost) { throw "Boost installation was not found under C:\local" }
          "BOOST_ROOT=$($boost.FullName -replace '\\','/')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install boost qt@5
          echo "$(brew --prefix qt@5)/bin" >> "$GITHUB_PATH"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            libboost-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libqt5opengl5-dev \
            qtbase5-dev

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            QT5_ROOT="$QT_ROOT_DIR"
            CMAKE_EXTRA_ARGS=()
          elif [ "$RUNNER_OS" = "macOS" ]; then
            QT5_ROOT="$(brew --prefix qt@5)"
            BOOST_ROOT="$(brew --prefix boost)"
            CMAKE_EXTRA_ARGS=()
          else
            QT5_ROOT=""
            BOOST_ROOT="/usr/include"
            CMAKE_EXTRA_ARGS=(
              -DBUILD_SHARED_LIBS=OFF
              -DCMAKE_SKIP_RPATH=ON
              -DCMAKE_C_FLAGS_RELEASE="-O0 -g0 -DNDEBUG"
              -DCMAKE_CXX_FLAGS_RELEASE="-O0 -g0 -DNDEBUG"
            )
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DQT5_ROOT="${QT5_ROOT}" -DBOOST_ROOT="${BOOST_ROOT}" "${CMAKE_EXTRA_ARGS[@]}"

      - name: Build
        timeout-minutes: 90
        shell: bash
        run: |
          cmake --build build --config Release --parallel 2

      - name: Test analysis and desktop resources
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package Windows desktop and CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cli = "build/bin/Release/urconnect-cli.exe"
          if (-not (Test-Path $cli)) { throw "urconnect-cli.exe was not found at $cli" }
          Copy-Item $cli "urconnect-cli-windows-x64.exe"
          & .\urconnect-cli-windows-x64.exe --version
          if ($LASTEXITCODE -ne 0) { throw "Windows CLI version check failed" }
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item build/bin/Release/UrConnect.exe package/
          Copy-Item build/bin/Release/shp.dll package/
          Copy-Item -Recurse build/bin/Release/ico package/
          Copy-Item $cli package/
          & windeployqt --release --compiler-runtime --no-translations package/UrConnect.exe
          if ($LASTEXITCODE -ne 0) { throw "Qt Windows deployment failed" }
          & ./scripts/bundle_windows_runtime.ps1

      - name: Check Windows desktop startup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $process = Start-Process -FilePath "$PWD/package/UrConnect.exe" -PassThru
          try {
            Start-Sleep -Seconds 5
            $process.Refresh()
            if ($process.HasExited) { throw "Windows desktop exited during startup (status $($process.ExitCode))" }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Check Windows CLI runtime dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe was not found" }
          $dependencies = & $dumpbin.FullName /dependents .\urconnect-cli-windows-x64.exe
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect Windows CLI dependencies" }
          $dependencies | Write-Output
          if ($dependencies -match '(?i)(VCRUNTIME|MSVCP|MSVCR|ucrtbase|api-ms-win-crt|Qt5|shp)\S*\.dll') {
            throw "Windows CLI depends on an external runtime DLL"
          }

      - name: Deploy Qt runtime on macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p package
          app_path=""
          for candidate in build/bin/UrConnect.app build/bin/Release/UrConnect.app; do
            if [ -d "$candidate" ]; then
              app_path="$candidate"
              break
            fi
          done
          if [ -z "$app_path" ]; then
            echo "UrConnect.app was not found under build/bin"
            find build/bin -maxdepth 3 -print || true
            exit 1
          fi
          cp -R "$app_path" package/
          macdeployqt package/UrConnect.app -always-overwrite
          bash scripts/bundle_macos_brotli.sh package/UrConnect.app
          codesign --force --deep --sign - package/UrConnect.app
          codesign --verify --deep --strict --verbose=2 package/UrConnect.app
          cli_path=""
          for candidate in build/bin/urconnect-cli build/bin/Release/urconnect-cli; do
            if [ -x "$candidate" ]; then
              cli_path="$candidate"
              break
            fi
          done
          if [ -z "$cli_path" ]; then
            echo "urconnect-cli was not found under build/bin"
            exit 1
          fi
          cp "$cli_path" package/
          package/urconnect-cli --version
          QT_DEBUG_PLUGINS=1 perl -e '
            $pid = fork(); die "fork failed" unless defined $pid;
            if (!$pid) { exec "package/UrConnect.app/Contents/MacOS/UrConnect"; exit 127; }
            sleep 5;
            if (waitpid($pid, 1) == $pid) { die "macOS desktop exited during startup: $?"; }
            kill "TERM", $pid; waitpid($pid, 0);
          '

      - name: Package Linux executable
        if: runner.os == 'Linux'
        run: |
          mkdir -p package
          bin_dir="build/bin"
          if [ -d "build/bin/Release" ]; then
            bin_dir="build/bin/Release"
          fi
          cp -R "$bin_dir"/. package/
          test -x package/urconnect-cli
          package/urconnect-cli --version

      - name: Check Linux package dependencies and startup
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for executable in package/UrConnect package/urconnect-cli; do
            dependencies="$(ldd "$executable")"
            printf '%s\n' "$dependencies"
            if grep -q 'not found' <<< "$dependencies"; then
              echo "Missing dependency in $executable"
              exit 1
            fi
            dynamic_section="$(readelf -d "$executable")"
            if grep -Eq 'libshp|/home/runner/' <<< "$dynamic_section"; then
              echo "Unpackaged Shapelib or build-machine path in $executable"
              exit 1
            fi
          done
          if readelf -d package/urconnect-cli | grep -q 'NEEDED.*Qt'; then
            echo "The CLI must not depend on Qt"
            exit 1
          fi
          set +e
          QT_QPA_PLATFORM=offscreen timeout 5s package/UrConnect
          result=$?
          set -e
          if [ "$result" -ne 124 ]; then
            echo "Linux GUI exited before the startup smoke test finished (status $result)"
            exit 1
          fi

      - name: Add examples, validation reports, license and notices
        shell: bash
        run: |
          cp -R examples package/
          mkdir -p package/validation
          cp build/cli/reach-validation-Release.csv package/validation/
          cp build/cli/reach-validation-Release.md package/validation/
          cp cli/tests/REACH_VALIDATION.md package/validation/
          cp LICENSE package/
          cp THIRD_PARTY_NOTICES.md package/
          cp -R licenses package/
          cp SNDAApp/lib/COPYING package/Shapelib-COPYING.txt
          cp genlib/lgpl.txt package/genlib-LGPL.txt
          cat > package/README.txt <<EOF
          UrConnect ${GITHUB_REF_NAME:-manual}
          Platform: ${{ matrix.name }}
          Status: ${{ matrix.release-status }}

          This package contains the rebuilt desktop application and standalone CLI. macOS and Linux packages remain experimental. Extract the whole package before running the desktop application.

          Example street networks: examples/apt/ and examples/hangzhou/.
          Reach correctness: validation/ contains hand-derived reference values and this build's per-segment CSV results and maximum-error summary.
          EOF
          if [ "$RUNNER_OS" = "Linux" ]; then
            printf '\nLinux binaries are built and tested on Ubuntu 24.04 x64. The desktop app requires system Qt 5, OpenGL and GLU libraries; the CLI requires only the standard C/C++ runtime, not Qt or Shapelib DLLs.\n' >> package/README.txt
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            cat >> package/README.txt <<'EOF'

          Getting started (Windows x64):
          1. Extract the entire ZIP to a folder.
          2. Open UrConnect.exe. Keep all DLLs and subfolders beside it.
          Qt and the required MSVC runtime are included; no separate Qt installation is needed.
          The executable is not publisher-signed, so Windows may ask you to confirm the publisher before opening it.
          EOF
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            cat >> package/README.txt <<'EOF'

          Getting started (macOS, Apple Silicon / arm64):
          1. Extract the archive. This build is for Apple Silicon Macs, not Intel Macs.
          2. Open UrConnect.app, or drag it to Applications first.
          Qt and its required runtime libraries are included; Homebrew and a separate Qt installation are not needed.
          This app is ad-hoc signed, not Apple-notarized. On first launch, macOS may require approval under System Settings > Privacy & Security > Open Anyway after you try opening it.
          Keep examples/ if you want the bundled Apt and Hangzhou datasets. urconnect-cli is optional for command-line use.
          EOF
          fi

      - name: Archive Unix package
        if: runner.os != 'Windows'
        run: tar -czf "UrConnect-${GITHUB_REF_NAME:-manual}-${{ matrix.package-suffix }}.tar.gz" -C package .

      - name: Archive Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path package/* -DestinationPath "UrConnect-$env:GITHUB_REF_NAME-windows-x64.zip"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            urconnect-cli-windows-x64.exe
            UrConnect-*.tar.gz
            UrConnect-*.zip
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Write checksums
        run: |
          find artifacts -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed -E 's#  artifacts/[^/]+/#  #' > artifacts/SHA256SUMS.txt
      - name: Write release notes
        run: |
          cat > release-notes.md <<EOF
          UrConnect ${GITHUB_REF_NAME}

          Directional-metric reach now follows the Grasshopper reference procedure: first select the directional-reachable road subset, then calculate metric reach within that subset. This applies to whole-network analysis, interactive origin-based reach, and collective reach from selected segments. Partial coverage and overlapping selected-source fragments are retained and merged consistently.

          Automated validation checks 885 expected values across 339 cases on three hand-derived networks, including competing routes, scalar and multi-parameter runs, partial segments, reversed endpoints, interactive reach geometry, and collective coverage. The in-memory tolerance is 1e-9 m. Separately, all 207 Apt directional-metric reach results matched the supplied Grasshopper reference within 0.001 m (maximum difference 0.0001 m after DBF rounding). Fifteen non-DMR analysis cases produced identical data and geometry outputs before and after the calculation change.

          Every desktop package includes the Apt and Hangzhou Shapefile datasets under examples/, plus the reference derivation, per-segment results and maximum-error summary under validation/.

          Retains the reach boundary fixes and runtime packaging from v0.2.3, including the Brotli dependency required by the macOS Cocoa plugin. No other analysis branches were changed for this release.

          Windows desktop application:
          - Rebuilt UrConnect.exe with bundled Qt runtime in the Windows x64 ZIP. Extract the complete ZIP before running.

          Command-line interface:
          - Windows x64: urconnect-cli-windows-x64.exe

          Experimental artifacts:
          - macOS arm64 (Apple Silicon only; bundled Qt runtime; ad-hoc signed, not Apple-notarized)
          - Linux x64

          Desktop and CLI packages for all three platforms use the updated shared C++ analysis code and pass automated regression tests. macOS and Linux packages remain marked experimental while broader platform validation continues.

          Linux binaries are built and tested on Ubuntu 24.04 x64. The desktop application requires system Qt 5, OpenGL and GLU libraries; the CLI does not require Qt or a separately installed Shapelib library.
          EOF
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: UrConnect ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            artifacts/**/UrConnect-*.tar.gz
            artifacts/**/UrConnect-*.zip
            artifacts/**/urconnect-cli-windows-x64.exe
            artifacts/SHA256SUMS.txt
          overwrite_files: false
          draft: false
          prerelease: false

  repair-windows:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.repair_windows_release != '' }}
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPAIR_RELEASE: ${{ inputs.repair_windows_release }}
    steps:
      - uses: actions/checkout@v5
      - name: Download existing release packages
        shell: pwsh
        run: |
          if ($env:REPAIR_RELEASE -notmatch '^v\d+\.\d+\.\d+$') { throw "Expected a semantic version tag" }
          gh release download $env:REPAIR_RELEASE --dir assets
          if ($LASTEXITCODE -ne 0) { throw "Release download failed" }
          $zip = "assets/UrConnect-$env:REPAIR_RELEASE-windows-x64.zip"
          Expand-Archive $zip package
      - name: Bundle and verify desktop runtime
        shell: pwsh
        run: |
          & ./scripts/bundle_windows_runtime.ps1
          $version = & ./package/urconnect-cli.exe --version
          if ($LASTEXITCODE -ne 0 -or $version -notlike "urconnect-cli $($env:REPAIR_RELEASE.Substring(1)) *") {
            throw "Release binary version does not match the requested tag"
          }
          $env:QT_QPA_PLATFORM = "offscreen"
          $process = Start-Process -FilePath "$PWD/package/UrConnect.exe" -PassThru
          try {
            Start-Sleep -Seconds 5
            $process.Refresh()
            if ($process.HasExited) { throw "Repaired desktop failed to start" }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Update package and checksums
        shell: pwsh
        run: |
          $zip = "assets/UrConnect-$env:REPAIR_RELEASE-windows-x64.zip"
          Compress-Archive -Path package/* -DestinationPath $zip -Force
          $lines = Get-ChildItem assets -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
            Sort-Object Name | ForEach-Object {
              "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
            }
          [IO.File]::WriteAllText("$PWD/assets/SHA256SUMS.txt", ($lines -join "`n") + "`n", [Text.UTF8Encoding]::new($false))
          gh release upload $env:REPAIR_RELEASE $zip assets/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw "Release package update failed" }
