name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  cli:
    name: CLI ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: macos-arm64
            os: macos-14
          - name: linux-x64
            os: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install boost-msvc-14.3 -y
          $boost = Get-ChildItem C:\local -Directory -Filter "boost_*" | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $boost) { throw "Boost installation was not found under C:\local" }
          "BOOST_ROOT=$($boost.FullName -replace '\\','/')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install boost

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential cmake libboost-dev

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            BOOST_ROOT="$(brew --prefix boost)"
          elif [ "$RUNNER_OS" = "Linux" ]; then
            BOOST_ROOT="/usr/include"
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DURCONNECT_BUILD_GUI=OFF -DBOOST_ROOT="${BOOST_ROOT}"

      - name: Build
        run: cmake --build build --config Release --parallel --target urconnect-cli urconnect-test-network

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Build Windows Debug
        if: runner.os == 'Windows'
        run: cmake --build build --config Debug --parallel --target urconnect-cli urconnect-test-network

      - name: Test Windows Debug
        if: runner.os == 'Windows'
        run: ctest --test-dir build -C Debug --output-on-failure
