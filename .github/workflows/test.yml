name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  cli:
    name: CLI ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: macos-arm64
            os: macos-15
          - name: linux-x64
            os: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install boost-msvc-14.3 -y
          $boost = Get-ChildItem C:\local -Directory -Filter "boost_*" | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $boost) { throw "Boost installation was not found under C:\local" }
          "BOOST_ROOT=$($boost.FullName -replace '\\','/')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install boost

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential cmake libboost-dev

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            BOOST_ROOT="$(brew --prefix boost)"
          elif [ "$RUNNER_OS" = "Linux" ]; then
            BOOST_ROOT="/usr/include"
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DURCONNECT_BUILD_GUI=OFF -DBOOST_ROOT="${BOOST_ROOT}"

      - name: Build
        run: cmake --build build --config Release --parallel 2 --target urconnect-cli urconnect-test-network urconnect-test-ddl urconnect-test-csv-export urconnect-test-reach

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Build Windows Debug
        if: runner.os == 'Windows'
        run: cmake --build build --config Debug --parallel 2 --target urconnect-cli urconnect-test-network urconnect-test-ddl urconnect-test-csv-export urconnect-test-reach

      - name: Test Windows Debug
        if: runner.os == 'Windows'
        run: ctest --test-dir build -C Debug --output-on-failure

      - name: Summarize reach correctness
        if: always()
        shell: bash
        run: |
          for report in build/cli/reach-validation-*.md; do
            if [ -f "$report" ]; then
              printf '\n## %s\n\n' "$(basename "$report" .md)" >> "$GITHUB_STEP_SUMMARY"
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload reach correctness reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reach-correctness-${{ matrix.name }}
          path: build/cli/reach-validation-*
          if-no-files-found: warn
